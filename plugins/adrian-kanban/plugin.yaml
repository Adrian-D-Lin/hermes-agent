name: adrian-kanban
description: >-
  Complete Adrian-specific mutation authority for the shared Kanban board.
  When selected, it replaces all 18 public Kanban operations and supplies the
  verified-input pre-tool hook. Native selection leaves it inert.
version: 0.4.1
author: NousResearch
kind: standalone
manifest_version: 2
capabilities:
  - tools.override
hermes:
  protocol_version: "2"
  schema_version: "1"
  registry_version: "v0.28-s2-1"
  skill_bundle_version: "0.2.0"
  desktop_extension_version: "0.2.2"
provides_tools:
  - kanban_show
  - kanban_list
  - kanban_attachments
  - kanban_create
  - kanban_complete
  - kanban_block
  - kanban_unblock
  - kanban_comment
  - kanban_link
  - kanban_heartbeat
  - kanban_attach
  - kanban_attach_url
  - kanban_request_changes
  - kanban_request_review
  - kanban_create_initiative
  - kanban_update_initiative
  - kanban_transition_initiative
  - kanban_close_initiative
provides_hooks:
  - pre_tool_call
  - pre_user_turn
