name: adrian-kanban
description: >-
  adrian-kanban — the inactive, generic mutation-authority seam for the shared
  Kanban board. S1 establishes ONLY the selection seam, the narrow
  authority-provider/capability interface, a test-only provider fixture, and the
  non-public foundational schema/store. It does NOT implement production
  capability creation, validation, binding, consumption, typed initiative
  approval, the private worker adapter, plugin eligibility dispatch, or
  Write-Gate admission (those are S2). When ``kanban.mutation_authority`` is
  ``adrian-kanban`` and the configured provider is not present, compatible,
  healthy, and supplies the admitted-operation interface, native mutation and
  dispatch fail closed with no fallback. The default ``native`` preserves the
  installed behavior exactly.
version: 0.1.0
author: NousResearch
kind: backend
